<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="icon" href="%PUBLIC_URL%/bannerImg.png" type="image/png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- 🎨 Prevent flash of wrong theme (FOUC) -->
    <script>
      (function () {
        try {
          var useSaved = true; // 👈 match this with useSavedPreference in ThemeContext.js
          var saved = useSaved ? localStorage.getItem("theme") : null;
          var theme = saved;
          if (!theme) {
            theme = window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          // Fail silently
        }
      })();
    </script>

    <title>manavpanchall || Personal Portfolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
